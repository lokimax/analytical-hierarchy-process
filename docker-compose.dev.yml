version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ahp-postgres-dev
    environment:
      POSTGRES_DB: ahp_db
      POSTGRES_USER: ahp_user
      POSTGRES_PASSWORD: ahp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ahp-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog - Email Testing Tool
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ahp-mailhog-dev
    ports:
      - "1025:1025"  # SMTP Server
      - "8025:8025"  # Web UI
    networks:
      - ahp-network-dev

  # Spring Boot Backend (mit eingebautem Frontend)
  ahp-backend:
    image: ahp-backend:latest
    container_name: ahp-backend-dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ahp_db
      SPRING_DATASOURCE_USERNAME: ahp_user
      SPRING_DATASOURCE_PASSWORD: ahp_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_DE_X132_AHP: DEBUG
      # Mail Configuration
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      APP_MAIL_FROM: noreply@ahp-dev.local
      APP_ACTIVATION_FRONTEND_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - ahp-network-dev

networks:
  ahp-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
