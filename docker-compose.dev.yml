version: '3.8'

# Vereinfachte Docker Compose für lokale Entwicklung (ohne Frontend Build)
# Frontend läuft auf Port 4200 via `ng serve`

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ahp-postgres-dev
    environment:
      POSTGRES_DB: ahp_db
      POSTGRES_USER: ahp_user
      POSTGRES_PASSWORD: ahp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ahp-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  ahp-backend:
    build:
      context: .
      dockerfile: ahp-backend/Dockerfile
    container_name: ahp-backend-dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ahp_db
      SPRING_DATASOURCE_USERNAME: ahp_user
      SPRING_DATASOURCE_PASSWORD: ahp_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 9000
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_DE_X132_AHP: DEBUG
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ahp-network-dev

networks:
  ahp-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
