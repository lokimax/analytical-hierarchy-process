<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Login</h2>

          <form (ngSubmit)="login()">
            <div class="mb-3">
              <label for="identifier" class="form-label">Nickname or Email</label>
              <input type="text" class="form-control" id="identifier" [(ngModel)]="form.identifier" name="identifier"
                required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input [type]="showPassword() ? 'text' : 'password'" class="form-control" id="password"
                  [(ngModel)]="form.password" name="password" autocomplete="current-password" required>
                <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()"
                  tabindex="-1">
                  <i [ngClass]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
              </div>
              <div class="mb-3 text-end">
                <a routerLink="/request-password-reset" class="text-decoration-none small">Forgot Password?</a>
              </div>
            </div>

            <div *ngIf="error()" class="alert alert-danger" role="alert">
              {{ error() }}
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="isSubmitting()">
              <span *ngIf="!isSubmitting()">Login</span>
              <span *ngIf="isSubmitting()">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Logging in...
              </span>
            </button>
          </form>

          <hr>

          <p class="text-center mb-0">
            Don't have an account?
            <a routerLink="/register" class="btn btn-link p-0">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
