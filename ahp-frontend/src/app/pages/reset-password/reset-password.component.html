<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Set New Password</h2>

          <div *ngIf="!success(); else successTemplate">
            <form (ngSubmit)="submit()">
              <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <div class="input-group">
                  <input [type]="showPassword() ? 'text' : 'password'" class="form-control" id="password"
                    [(ngModel)]="password" name="password" required minlength="8" autocomplete="new-password">
                  <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()"
                    tabindex="-1">
                    <i [ngClass]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                  <input [type]="showPassword() ? 'text' : 'password'" class="form-control" id="confirmPassword"
                    [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password">
                  <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()"
                    tabindex="-1">
                    <i [ngClass]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                  </button>
                </div>
              </div>

              <div *ngIf="message()" class="alert alert-info" role="alert">
                {{ message() }}
              </div>

              <div *ngIf="error()" class="alert alert-danger" role="alert">
                {{ error() }}
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="isSubmitting() || !token">
                <span *ngIf="!isSubmitting()">Reset Password</span>
                <span *ngIf="isSubmitting()">
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Resetting...
                </span>
              </button>
            </form>
          </div>

          <ng-template #successTemplate>
            <div class="alert alert-success" role="alert">
              {{ message() }}
            </div>
            <p class="text-center">
              Redirecting to login...
            </p>
            <div class="d-grid gap-2">
              <a routerLink="/login" class="btn btn-primary">Go to Login</a>
            </div>
          </ng-template>

        </div>
      </div>
    </div>
  </div>
</div>
