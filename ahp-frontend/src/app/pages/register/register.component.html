<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Register</h2>
          
          <form (ngSubmit)="register()">
            <div class="mb-3">
              <label for="nickname" class="form-label">Nickname</label>
              <input 
                type="text" 
                class="form-control" 
                id="nickname"
                [(ngModel)]="form.nickname"
                name="nickname"
                required
              >
            </div>

            <div class="mb-3">
              <label for="name" class="form-label">First Name</label>
              <input 
                type="text" 
                class="form-control" 
                id="name"
                [(ngModel)]="form.name"
                name="name"
                required
              >
            </div>

            <div class="mb-3">
              <label for="surename" class="form-label">Last Name</label>
              <input 
                type="text" 
                class="form-control" 
                id="surename"
                [(ngModel)]="form.surename"
                name="surename"
                required
              >
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input 
                type="email" 
                class="form-control" 
                id="email"
                [(ngModel)]="form.email"
                name="email"
                required
              >
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input 
                  [type]="showPassword() ? 'text' : 'password'"
                  class="form-control" 
                  id="password"
                  [(ngModel)]="form.password"
                  name="password"
                  autocomplete="new-password"
                  required
                  minlength="8"
                  (input)="onPasswordChange()"
                >
                <button 
                  type="button" 
                  class="btn btn-outline-secondary" 
                  (click)="togglePasswordVisibility()"
                  tabindex="-1"
                >
                  <i [ngClass]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <div class="input-group">
                <input 
                  [type]="showConfirmPassword() ? 'text' : 'password'"
                  [class]="'form-control ' + (form.confirmPassword.length > 0 ? (passwordsMatch() ? 'is-valid' : 'is-invalid') : '')"
                  id="confirmPassword"
                  [(ngModel)]="form.confirmPassword"
                  name="confirmPassword"
                  autocomplete="new-password"
                  required
                  (input)="onConfirmPasswordChange()"
                >
                <button 
                  type="button" 
                  class="btn btn-outline-secondary" 
                  (click)="toggleConfirmPasswordVisibility()"
                  tabindex="-1"
                >
                  <i [ngClass]="showConfirmPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
                <span 
                  *ngIf="form.confirmPassword.length > 0" 
                  [class]="'input-group-text ' + (passwordsMatch() ? 'text-success' : 'text-danger')"
                >
                  <i [ngClass]="passwordsMatch() ? 'bi bi-check-circle-fill' : 'bi bi-x-circle-fill'"></i>
                </span>
              </div>
              <div *ngIf="form.confirmPassword.length > 0" [class]="'form-text ' + (passwordsMatch() ? 'text-success' : 'text-danger')">
                <small *ngIf="passwordsMatch()">✓ Passwords match</small>
                <small *ngIf="!passwordsMatch()">✗ Passwords do not match</small>
              </div>
            </div>

            <div *ngIf="error()" class="alert alert-danger" role="alert">
              {{ error() }}
            </div>

            <div *ngIf="success()" class="alert alert-success" role="alert">
              {{ success() }}
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="isSubmitting() || (form.confirmPassword.length > 0 && !passwordsMatch())">
              <span *ngIf="!isSubmitting()">Register</span>
              <span *ngIf="isSubmitting()">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Registering...
              </span>
            </button>
          </form>

          <hr>
          
          <p class="text-center mb-0">
            Already have an account? 
            <a routerLink="/login" class="btn btn-link p-0">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
