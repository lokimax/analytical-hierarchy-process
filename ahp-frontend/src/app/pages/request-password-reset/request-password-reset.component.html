<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Reset Password</h2>
          
          <form (ngSubmit)="submit()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input 
                type="email" 
                class="form-control" 
                id="email"
                [(ngModel)]="email"
                name="email"
                required
              >
            </div>

            <div *ngIf="message()" class="alert alert-info" role="alert">
              {{ message() }}
            </div>

            <div *ngIf="error()" class="alert alert-danger" role="alert">
              {{ error() }}
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="isSubmitting()">
              <span *ngIf="!isSubmitting()">Send Reset Link</span>
              <span *ngIf="isSubmitting()">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Sending...
              </span>
            </button>
          </form>

          <hr>
          
          <p class="text-center mb-0">
            Remember your password?
            <a routerLink="/login" class="btn btn-link p-0">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
