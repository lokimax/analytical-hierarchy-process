spring:
  application:
    name: ahp-backend
  
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./ahp_db;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password: 
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
        
  sql:
    init:
      mode: always

server:
  port: 9000
  
logging:
  level:
    de.x132.ahp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
